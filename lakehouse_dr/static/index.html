<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>湖仓灾备演练控制台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">▰▰</span>
    <div>
      <h1>本地湖仓灾备演练</h1>
      <p class="sub">文件版本 · 元数据快照 · CDC 位点 · 质量门禁 · 时间点恢复</p>
    </div>
  </div>
  <div id="overview" class="overview"></div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="backups">备份清单</button>
  <button class="tab" data-tab="recoveries">恢复演练</button>
  <button class="tab" data-tab="gaps">缺口分析</button>
  <button class="tab" data-tab="diff">差异对比</button>
  <button class="tab" data-tab="lakehouse">生产湖仓</button>
  <span class="spacer"></span>
  <button id="refresh-btn" class="btn ghost">⟳ 刷新</button>
  <label class="auto"><input type="checkbox" id="auto-refresh" checked> 自动刷新</label>
</nav>

<main>
  <!-- ======================== BACKUPS ======================== -->
  <section id="tab-backups" class="panel active">
    <div class="toolbar">
      <button class="btn primary" id="btn-backup-full">创建全量备份</button>
      <button class="btn" id="btn-backup-inc">增量备份</button>
      <input id="backup-note" placeholder="备份备注（可选）">
      <span class="hint">备份不可变；损坏的湖仓文件会让门禁失败但仍保留快照</span>
    </div>
    <table class="grid">
      <thead><tr>
        <th>备份 ID</th><th>时间</th><th>类型</th><th>CDC 位点</th>
        <th>文件数</th><th>新 Blob</th><th>质量门禁</th><th>父备份</th><th>操作</th>
      </tr></thead>
      <tbody id="backup-rows"></tbody>
    </table>
    <div id="backup-detail" class="detail hidden"></div>
  </section>

  <!-- ====================== RECOVERIES ====================== -->
  <section id="tab-recoveries" class="panel">
    <div class="toolbar">
      <select id="rc-backup"></select>
      <input id="rc-target-seq" type="number" placeholder="目标 CDC seq（留空=备份位点）" min="0">
      <input id="rc-target-time" placeholder="或目标时间点 (ISO)">
      <input id="rc-note" placeholder="演练备注">
      <button class="btn primary" id="btn-rc-create">创建恢复演练</button>
    </div>
    <div class="toolbar sub">
      <span class="hint">恢复目标固定在 recovery_area/，带生产标记的目录会被硬性拒绝——恢复不能覆盖现有生产快照</span>
    </div>
    <table class="grid">
      <thead><tr>
        <th>恢复 ID</th><th>状态</th><th>基线备份</th><th>CDC 区间</th>
        <th>当前阶段</th><th>隔离文件</th><th>创建时间</th><th>操作</th>
      </tr></thead>
      <tbody id="recovery-rows"></tbody>
    </table>
    <div id="recovery-detail" class="detail hidden"></div>
  </section>

  <!-- ========================= GAPS ========================= -->
  <section id="tab-gaps" class="panel">
    <div class="toolbar">
      <select id="gap-recovery"><option value="">全局视角（不绑定恢复）</option></select>
    </div>
    <div id="gap-view"></div>
  </section>

  <!-- ========================= DIFF ========================= -->
  <section id="tab-diff" class="panel">
    <div class="toolbar">
      <select id="diff-recovery"></select>
    </div>
    <div id="diff-view"><p class="empty">选择一次恢复演练查看差异</p></div>
  </section>

  <!-- ======================= LAKEHOUSE ====================== -->
  <section id="tab-lakehouse" class="panel">
    <div id="lakehouse-view"></div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
